[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seed-vc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.12.0",
    "descript-audio-codec>=1.0.0",
    "einops==0.8.0",
    "freesimplegui==5.1.1",
    "funasr==1.1.5",
    "gradio==5.23.0",
    "huggingface-hub>=0.28.1",
    "hydra-core==1.3.2",
    "jiwer==3.0.3",
    "librosa==0.10.2",
    "modelscope==1.18.1",
    "munch==4.0.0",
    "numpy==1.26.4",
    "pydub==0.25.1",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "resemblyzer>=0.1.4",
    "scipy>=1.13.1",
    "sounddevice==0.5.0",
    "soundfile==0.12.1",
    "tqdm>=4.67.1",
    "transformers==4.46.3",
]

[tool.setuptools]
packages = ["modules", "baselines"]
py-modules = ["inference", "inference_v2", "inference1", "seed_vc_wrapper", "hf_utils", "train", "train_v2", "eval", "app", "app_vc", "app_vc_v2", "app_svc", "real-time-gui", "optimizers"]
